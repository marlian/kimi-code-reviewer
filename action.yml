name: 'Kimi Code Reviewer'
description: 'AI-powered code review using Moonshot Kimi or Kimi Code with 256K context window'
author: 'howardpen9'

branding:
  icon: 'eye'
  color: 'blue'

inputs:
  kimi_api_key:
    description: 'Moonshot AI API key (platform.moonshot.ai) or Kimi Code API key (code.kimi.com)'
    required: true
  github_token:
    description: 'GitHub token for API access'
    required: false
    default: ${{ github.token }}
  base_url:
    description: 'API base URL. Default https://api.moonshot.cn/v1 (Moonshot). For Kimi Code use https://api.kimi.com/coding/v1'
    required: false
    default: ''
  model:
    description: 'Kimi model to use. Default kimi-k2.5 (Moonshot). For Kimi Code use k2p6'
    required: false
    default: ''
  protocol:
    description: 'API protocol: openai or anthropic. Auto-detected from base_url when omitted.'
    required: false
    default: ''
  thinking:
    description: 'Thinking mode: default, enabled, or disabled. Set enabled for Kimi Code k2p6 deep reviews.'
    required: false
    default: 'default'
  reasoning_effort:
    description: 'Reasoning effort for thinking mode: high or max. Maps to output_config.effort on Anthropic protocol.'
    required: false
    default: ''
  timeout_ms:
    description: 'Ceiling on one API call in milliseconds, connection to last byte. With streaming on, long thinking-mode calls are bounded by idle_timeout_ms, not by this.'
    required: false
    default: '300000'
  idle_timeout_ms:
    description: 'Longest silence tolerated on a streaming call, in milliseconds: no bytes (text, thinking deltas or keep-alive pings) for this long abandons the call, and it is retried. Default 120000.'
    required: false
    default: ''
  retry_attempts:
    description: 'Total attempts per API call. Only 5xx, dropped or stalled connections and broken streams are retried, with backoff; quota and auth refusals never are. Default 3.'
    required: false
    default: ''
  max_tokens:
    description: 'Output cap (max_tokens) sent with every call. When the provider reports it cut the review off, the outcome is incomplete with reason max-tokens. Default 16384.'
    required: false
    default: ''
  stream:
    description: 'true (default) streams the response and keeps the connection alive through the reasoning phase; false sends a plain request and waits, which edge proxies drop after ~600s of silence.'
    required: false
    default: ''
  language:
    description: 'Review comment language (en, zh-TW, zh-CN, ja, ko)'
    required: false
    default: 'en'
  fail_on:
    description: 'Fail the check on: critical, warning, never'
    required: false
    default: 'critical'
  config_path:
    description: 'Path to config file (relative to repo root)'
    required: false
    default: '.kimi-review.yml'

outputs:
  outcome:
    description: "'complete' when the model returned a review, 'incomplete' when the provider refused the call (quota, 5xx), the call never completed (network, idle-timeout, timeout, stream) or the output could not be parsed; an incomplete run ends the check run neutral and fails the job unless fail_on is never"
  incomplete_reason:
    description: "Why the outcome is incomplete: 'quota', 'server', 'network', 'idle-timeout', 'timeout', 'stream', 'malformed-json' or 'max-tokens'; empty when complete"
  review_summary:
    description: 'The review summary text'
  annotations_count:
    description: 'Number of annotations created'
  critical_count:
    description: 'Number of critical issues found'
  tokens_used:
    description: 'Total tokens used'
  cost_estimate:
    description: 'Estimated API cost in USD'

runs:
  using: 'node20'
  main: 'action/dist/index.js'
